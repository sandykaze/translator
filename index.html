    <meta name="theme-color" content="#17191d">

    <style>
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f8f9fb;
  --text:#111318;
  --muted:#747a84;
  --line:#e5e7eb;
  --accent:#17191d;
  --accent-hover:#30343a;
  --blue:#3157d5;
  --green:#18835b;
  --violet:#7254b8;
  --orange:#c2760f;
  --shadow:0 18px 50px rgba(16,24,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.95),transparent 38%),
    var(--bg);
  color:var(--text);
  padding:42px 24px 56px;
}
.container{max-width:1180px;width:100%;margin:0 auto}
header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 4px 28px;border-bottom:1px solid var(--line);margin-bottom:28px
}
.brand{display:flex;flex-direction:column;gap:7px}
.brand-row{display:flex;align-items:center;gap:11px}
.brand-logo{width:40px;height:40px;border-radius:10px;display:block}
h1{font-size:2rem;line-height:1;font-weight:900;letter-spacing:-.045em;color:var(--text);font-family:'Futura','Futura PT','Jost',-apple-system,sans-serif}
.brand-sub{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.api-key-section{display:flex;align-items:center;gap:8px}
.header-controls{display:flex;align-items:center;gap:14px}
.ui-lang-switch{
  display:flex;align-items:center;gap:2px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:3px;
}
.lang-btn{
  border:0;background:transparent;cursor:pointer;
  padding:6px 12px;border-radius:6px;font-size:.78rem;font-weight:600;
  color:var(--muted);transition:.15s;
}
.lang-btn:hover{color:var(--text)}
.lang-btn.active{background:var(--accent);color:#fff}
.api-key-section select{
  height:36px;padding:0 30px 0 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);font-size:.78rem;color:var(--text);
  outline:none;cursor:pointer
}
.api-key-section input{
  width:220px;height:36px;padding:0 13px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);font-size:.82rem;outline:none
}
.api-key-section input:focus{border-color:#b9bdc5;box-shadow:0 0 0 3px rgba(23,25,29,.05)}
.main-grid{display:grid;grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr);gap:22px;align-items:stretch}
.panel{
  background:rgba(255,255,255,.92);border:1px solid rgba(229,231,235,.9);
  border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;
  box-shadow:var(--shadow)
}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--line)
}
.panel-title strong{font-size:.9rem;letter-spacing:.01em}
.panel-title span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.field{display:flex;flex-direction:column;gap:0}
.field>label{display:block;line-height:1.3;margin:0 0 7px}
label{font-weight:600;font-size:.78rem;color:#3c4149;letter-spacing:.01em;margin:0}
textarea,select{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);font-size:.9rem;color:var(--text);resize:vertical;outline:none;
  transition:.2s
}
textarea{line-height:1.55}
textarea:focus,select:focus{border-color:#aeb3bc;background:#fff;box-shadow:0 0 0 3px rgba(23,25,29,.045)}
.radio-group,.checkbox-group{display:grid;grid-template-columns:1fr;gap:7px}
.radio-label,.checkbox-label{
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-weight:400;
  font-size:.82rem;color:#4b515b;line-height:1.35;margin:0
}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);margin-top:2px}
.btn{
  background:var(--accent);color:#fff;border:0;padding:13px 18px;border-radius:10px;
  font-weight:650;font-size:.88rem;cursor:pointer;transition:.2s;width:100%;
  letter-spacing:.01em
}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn:disabled{background:#a4a8ae;cursor:not-allowed;transform:none}
.result-card{
  min-height:148px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:18px 19px;position:relative;display:none
}
.result-title{
  font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  color:var(--text);position:relative;padding-left:29px;
}
.result-title::before{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  font-size:.58rem;font-weight:800;letter-spacing:.04em;color:#9a9ea5;
  font-variant-numeric:tabular-nums;
}
.tag-spoken::before{content:'01'}
.tag-oral::before{content:'02'}
.tag-business::before{content:'03'}
.tag-formal::before{content:'04'}
.tag-spoken,.tag-oral,.tag-business,.tag-formal{color:var(--text)}
.result-title > span:first-child{position:relative}
.result-title > span:first-child::before{
  content:'';position:absolute;left:-18px;top:50%;width:10px;height:1px;
  background:#c4c7cc;transform:translateY(-50%);
}
.result-content{
  font-size:.92rem;line-height:1.72;white-space:pre-wrap;color:#30353d;word-break:break-word
}
.copy-btn{
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 9px;
  font-size:.7rem;cursor:pointer;color:#626873;white-space:nowrap
}
.copy-btn:hover{background:#f0f1f3;color:var(--text)}
.loading{text-align:center;padding:90px 0;color:var(--muted);font-size:.82rem;display:none}
#results{display:flex;flex-direction:column;gap:12px;flex:1}

.step-indicator{
  display:flex;flex-direction:column;gap:0;
  padding:6px 2px 18px;
}
.step-item{
  display:flex;align-items:center;gap:11px;
  padding:8px 2px;
  font-size:.82rem;color:var(--muted);
  position:relative;
}
.step-item .step-dot{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;background:#fff;
  transition:.2s;
}
.step-item:not(:last-child)::before{
  content:'';position:absolute;left:8px;top:26px;
  width:2px;height:calc(100% - 4px);
  background:var(--line);
}
.step-item.done .step-dot{background:var(--green);border-color:var(--green)}
.step-item.done .step-dot::after{content:'✓';color:#fff;font-size:.62rem;font-weight:700}
.step-item.done:not(:last-child)::before{background:var(--green)}
.step-item.active{color:var(--text);font-weight:650}
.step-item.active .step-dot{border-color:var(--accent)}
.step-item.active .step-dot::after{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:pulse-dot 1s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}

                <label for="contextInput"><span data-i18n="context">Context</span> <span style="font-weight:400;color:var(--muted)" data-i18n="optional">(optional)</span></label>
                <textarea id="contextInput" rows="4" placeholder="Paste the original message or relevant context" data-i18n-placeholder="contextPlaceholder"></textarea>
            </div>

            
            <div class="field">
                <label for="ideaInput" data-i18n="yourMessage">Your message</label>
                <textarea id="ideaInput" rows="5" placeholder="Write what you want to say" data-i18n-placeholder="yourMessagePlaceholder"></textarea>
            </div>

            <button class="btn" id="submitBtn" onclick="generateResponse()" data-i18n="generate">Generate</button>
        </div>

        <div class="panel"><div class="panel-title"><strong data-i18n="output">Output</strong><span data-i18n="generated">Generated</span></div>
            
            <div id="loading" class="loading" data-i18n="connecting">Connecting…</div>
            <div id="stepIndicator" class="step-indicator" style="display:none"></div>

            <div id="results" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- 结果 0：简单口语 -->
                <div class="result-card" id="cardSpoken">
                    <div class="result-title tag-spoken">
                        <span data-i18n="casualSpoken">Simple Spoken</span>
                        <button class="copy-btn" onclick="copyText('resSpoken')" data-i18n="copyAll">复制全文</button>
                    </div>
                    <div class="result-content" id="resSpoken" data-i18n="waiting">等待生成...</div>
                </div>

                <!-- 结果 1：口头/IM -->
                <div class="result-card" id="cardOral">
                    <div class="result-title tag-oral">
                        <span data-i18n="casualIm">Casual / IM</span>
                        <button class="copy-btn" onclick="copyText('resOral')" data-i18n="copyAll">复制全文</button>
                    </div>
                    <div class="result-content" id="resOral" data-i18n="waiting">等待生成...</div>
                </div>

                <!-- 结果 2：标准商务 -->
                <div class="result-card" id="cardBusiness">
                    <div class="result-title tag-business">
                        <span data-i18n="business">Business</span>
                        <button class="copy-btn" onclick="copyText('resBusiness')" data-i18n="copyAll">复制全文</button>
                    </div>
                    <div class="result-content" id="resBusiness" data-i18n="waiting">等待生成...</div>
                </div>

                <!-- 结果 3：高度正式 -->
                <div class="result-card" id="cardFormal">
                    <div class="result-title tag-formal">
                        <span data-i18n="formal">Formal</span>
                        <button class="copy-btn" onclick="copyText('resFormal')" data-i18n="copyAll">复制全文</button>
                    </div>
                    <div class="result-content" id="resFormal" data-i18n="waiting">等待生成...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedProvider = localStorage.getItem('translator_provider');
        if (savedProvider && MODEL_OPTIONS[savedProvider]) {
            document.getElementById('providerSelect').value = savedProvider;
        }
        updateModelOptions();
        loadProviderKey();
        toggleCommMode();
        setUILang(localStorage.getItem('translator_ui_lang') || 'zh');
        renderHistory();
    };

    // ---------- UI 界面语言（与「Target language」翻译目标语言是两回事） ----------
    const I18N = {
        zh: {
            brandSub: '商务语言助手',
            history: '历史记录',
            clearHistory: '清空全部',
            back: '返回',
            restore: '恢复',
            save: '保存',
            targetLanguage: '目标语言',
            japanese: '日语',
            english: '英语',
            recipient: '收件对象',
            internalColleague: '内部 / 同事',
            externalPartner: '外部 / 合作伙伴',
            communication: '沟通方式',
            initiate: '主动发起',
            emailTag: '※ 邮件（需要标题）',
            reply: '回复',
            outputStyle: '输出风格',
            casualSpoken: '简单口语',
            casualIm: '即时通讯',
            business: '商务',
            formal: '正式',
            input: '输入',
            compose: '撰写',
            context: '上下文',
            optional: '（可选）',
            contextPlaceholder: '粘贴对方发来的原文或相关背景',
            yourMessage: '你想表达的内容',
            yourMessagePlaceholder: '写下你想表达的核心意思',
            generate: '生成',
            output: '输出',
            generated: '生成结果',
            connecting: '连接中…',
            copyAll: '复制全文',
            waiting: '等待生成...',
            apiKeySaved: 'API Key 已保存',
            apiKeyCleared: 'API Key 已清除',
            apiKeyRequired: '请先输入并保存 API Key',
            ideaRequired: '请填入你的核心表达要点！',
            toneRequired: '请至少勾选一种要生成的场景语气！',
            genFailed: '生成失败：',
            copied: '已复制到剪贴板！',
            stepConnect: '连接 AI 服务',
            stepSpoken: '生成 简单口语 文案',
            stepOral: '生成 口语/即时通讯 文案',
            stepBusiness: '生成 商务 文案',
            stepFormal: '生成 正式 文案',
            stepDone: '完成'
        },
        en: {
            brandSub: 'Business Language Assistant',
            history: 'History',
            clearHistory: 'Clear all',
            back: 'Back',
            restore: 'Restore',
            save: 'Save',
            targetLanguage: 'Target language',
            japanese: 'Japanese',
            english: 'English',
            recipient: 'Recipient',
            internalColleague: 'Internal / colleague',
            externalPartner: 'External / business partner',
            communication: 'Communication',
            initiate: 'Initiate',
            emailTag: '※ Email (adds a subject line)',
            reply: 'Reply',
            outputStyle: 'Output style',
            casualSpoken: 'Simple Spoken',
            casualIm: 'Casual / IM',
            business: 'Business',
            formal: 'Formal',
            input: 'Input',
            compose: 'Compose',
            context: 'Context',
            optional: '(optional)',
            contextPlaceholder: 'Paste the original message or relevant context',
            yourMessage: 'Your message',
            yourMessagePlaceholder: 'Write what you want to say',
            generate: 'Generate',
            output: 'Output',
            generated: 'Generated',
            connecting: 'Connecting…',
            copyAll: 'Copy all',
            waiting: 'Waiting to generate...',
            apiKeySaved: 'API Key saved',
            apiKeyCleared: 'API Key cleared',
            apiKeyRequired: 'Please enter and save the API Key for the selected provider.',
            ideaRequired: 'Please fill in your key message point!',
            toneRequired: 'Please select at least one tone to generate!',
            genFailed: 'Generation failed: ',
            copied: 'Copied to clipboard!',
            stepConnect: 'Connecting to AI',
            stepSpoken: 'Generating Simple Spoken',
            stepOral: 'Generating Casual / IM',
            stepBusiness: 'Generating Business',
            stepFormal: 'Generating Formal',
            stepDone: 'Done'
        }
    };

    let currentUILang = 'zh';

    function t(key) {
        return (I18N[currentUILang] && I18N[currentUILang][key]) || I18N.en[key] || key;
    }

    function setUILang(lang) {
        if (!I18N[lang]) lang = 'zh';
        currentUILang = lang;
        localStorage.setItem('translator_ui_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            // 结果卡片里已经有真实生成内容时，不要用「等待生成」占位符把它覆盖掉
            if (key === 'waiting' && el.classList.contains('result-content')) {
                const isPlaceholder = !el.dataset.hasContent;
                if (isPlaceholder) el.textContent = t('waiting');
                return;
            }
            el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
        });

        document.getElementById('langBtnZh').classList.toggle('active', lang === 'zh');
        document.getElementById('langBtnEn').classList.toggle('active', lang === 'en');
    }

    const MODEL_OPTIONS = {
        gemini: [
            { value: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash' },
            { value: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash' }
        ],
        zhipu: [
            { value: 'glm-4-airx', label: 'GLM-4-AirX' },
            { value: 'glm-4-air', label: 'GLM-4-Air' },
            { value: 'glm-4.6', label: 'GLM-4.6' }
        ]
    };

    const PROVIDER_DEFAULT_MODEL = {
        gemini: 'gemini-3.6-flash',
        zhipu: 'glm-4.6'
    };

    const PROVIDER_KEY_PLACEHOLDER = {
        gemini: 'Gemini API Key',
        zhipu: '智谱 (Zhipu) API Key'
    };

    function getCurrentProvider() {
        return document.getElementById('providerSelect').value;
    }

    function updateModelOptions() {
        const provider = getCurrentProvider();
        const select = document.getElementById('modelSelect');
        const savedModel = localStorage.getItem('translator_model_' + provider);
        select.innerHTML = '';

        MODEL_OPTIONS[provider].forEach(model => {
            const option = document.createElement('option');
            option.value = model.value;
            option.textContent = model.label;
            select.appendChild(option);
        });

        const valid = MODEL_OPTIONS[provider].some(m => m.value === savedModel);
        select.value = valid ? savedModel : PROVIDER_DEFAULT_MODEL[provider];

        select.onchange = function() {
            localStorage.setItem('translator_model_' + provider, select.value);
        };
    }

    function loadProviderKey() {
        const provider = getCurrentProvider();
        const savedKey = localStorage.getItem(provider + '_api_key') || '';
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('apiKey').placeholder = PROVIDER_KEY_PLACEHOLDER[provider];
    }

    function saveApiKey() {
        const provider = getCurrentProvider();
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem(provider + '_api_key', key);
            alert(t('apiKeySaved'));
        } else {
            localStorage.removeItem(provider + '_api_key');
            alert(t('apiKeyCleared'));
        }
    }

    function onProviderChange() {
        const provider = getCurrentProvider();
        localStorage.setItem('translator_provider', provider);
        updateModelOptions();
        loadProviderKey();
    }

    function toggleCommMode() {
        const mode = document.querySelector('input[name="commMode"]:checked').value;
        const contextGroup = document.getElementById('contextGroup');
        if (mode === 'initiate') {
            contextGroup.style.display = 'none';
        } else {
            contextGroup.style.display = 'block';
        }
    }

    async function generateResponse() {
        const provider = getCurrentProvider();
        const apiKey = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelSelect').value;
        const targetLang = document.getElementById('targetLang').value;
        const recipientType = document.querySelector('input[name="recipientType"]:checked').value;
        const mode = document.querySelector('input[name="commMode"]:checked').value;
        const isEmail = document.getElementById('isEmail').checked;
        const context = document.getElementById('contextInput').value.trim();
        const idea = document.getElementById('ideaInput').value.trim();

        const genSpoken = document.getElementById('genSpoken').checked;
        const genOral = document.getElementById('genOral').checked;
        const genBusiness = document.getElementById('genBusiness').checked;
        const genFormal = document.getElementById('genFormal').checked;

        if (!apiKey) {
            alert(t('apiKeyRequired'));
            return;
        }

        if (!idea) {
            alert(t('ideaRequired'));
            return;
        }

        if (!genSpoken && !genOral && !genBusiness && !genFormal) {
            alert(t('toneRequired'));
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const stepIndicatorEl = document.getElementById('stepIndicator');

        document.getElementById('cardSpoken').style.display = 'none';
        document.getElementById('cardOral').style.display = 'none';
        document.getElementById('cardBusiness').style.display = 'none';
        document.getElementById('cardFormal').style.display = 'none';

        submitBtn.disabled = true;
        loading.style.display = 'none';

        // 构建真实的步骤列表：连接 -> 依次生成各语气 -> 完成
        const stepDefs = [{ id: 'connect', label: t('stepConnect') }];
        const contentStepOrder = [];
        if (genSpoken) { stepDefs.push({ id: 'SPOKEN', label: t('stepSpoken') }); contentStepOrder.push('SPOKEN'); }
        if (genOral) { stepDefs.push({ id: 'ORAL', label: t('stepOral') }); contentStepOrder.push('ORAL'); }
        if (genBusiness) { stepDefs.push({ id: 'BUSINESS', label: t('stepBusiness') }); contentStepOrder.push('BUSINESS'); }
        if (genFormal) { stepDefs.push({ id: 'FORMAL', label: t('stepFormal') }); contentStepOrder.push('FORMAL'); }
        stepDefs.push({ id: 'done', label: t('stepDone') });

        stepIndicatorEl.innerHTML = stepDefs.map(s =>
            `<div class="step-item" data-step="${s.id}"><span class="step-dot"></span><span>${s.label}</span></div>`
        ).join('');
        stepIndicatorEl.style.display = 'flex';

        function setStepStatus(id, status) {
            const el = stepIndicatorEl.querySelector(`.step-item[data-step="${id}"]`);
            if (!el) return;
            el.classList.remove('done', 'active');
            if (status) el.classList.add(status);
        }

        setStepStatus('connect', 'active');
        let contentStepPos = 0;

        const isJapanese = targetLang === '日语';

        const greetingInstruction = isJapanese
            ? (recipientType === 'internal'
                ? '开头统一使用“お疲れ様です。”作为问候语。'
                : '开头统一使用“お世話になっております。”作为问候语。')
            : (recipientType === 'internal'
                ? '开头使用简短自然的英文问候语（如：Hi [Name], / Hope you are doing well,），不要用日语。'
                : '开头使用得体的英文商务问候语（如：Dear [Name], / Hello [Name],），不要用日语。');

        let prompt = `你是一位精通中日/中英商务沟通的专家。请将用户的要点翻译转换为【${targetLang}】。**无论如何，最终输出必须完全是${targetLang}，不允许混入其他语言的词汇或句子。**

【沟通基本设定】：
- 沟通对象：${recipientType === 'internal' ? '同事/跨部门同事' : '外部公司/店铺担当'}
- 开头寒暄要求：${greetingInstruction}
- 沟通模式：${mode === 'reply' ? 'Reply消息' : '主动找对方发起沟通'}
- 是否为邮件：${isEmail ? `是（如果生成商务或正式邮件，最上方需附带【${isJapanese ? '件名：xxx' : 'Subject: xxx'}】）` : '否（即时消息/普通文本）'}
${mode === 'reply' && context ? `- 【对方发来的原话/上下文】：${context}` : ''}
- 【用户想表达的核心意思】：${idea}

${isJapanese ? `【"〜の件" 使用规则（非常严格，请务必遵守）】：
1. **只有在【Reply】且上下文明确有某个具体事项时**，才可以自然使用"〜の件"引出话题。
2. **绝对禁止无上下文乱用"〜の件"**！如果用户是【Initiate发起沟通】，或者没有明确具体的对应事项，直接表达核心意思即可，切勿硬加"〜の件"。

` : ''}【场景语气分寸要求】：

`;

        if (genSpoken) {
            prompt += isJapanese ? `
[1. 简单口语场景（可以直接照着念出口，讲给对方听——面对面/电话/语音留言）]
- 使用者是非母语者，日语水平有限，务必让文本容易读出声、容易理解。
- 敬语标准：只使用最基础的です/ます体礼貌用语即可（如：ありがとうございます、お願いします、大丈夫です、わかりました）。**绝对不要**使用复杂敬语动词或谦让语（如：いたします、ご確認、拝見する、申し上げます 等）。
- 句子要短，一句只表达一个意思，多用简单常见词汇，避免生僻商务用语、长从句、汉语式直译腔。
- 风格：像是把要说的话直接写成"台词"，读出来自然顺口，但依然保持基本礼貌，不能显得没礼貌或太随意。
` : `
[1. Simple Spoken scenario (can be read aloud directly — in person, on the phone, or in a voice message)]
- The speaker is a non-native speaker with limited fluency — the text must be easy to say out loud and easy to understand.
- Tone: only basic, everyday politeness (e.g. "Thank you.", "Could you help me?", "Is that okay?", "I understand."). **Do not** use advanced vocabulary, idioms, or complex grammar.
- Sentences must be short, one idea per sentence, using common simple words — avoid business jargon, long clauses, or anything hard to pronounce.
- Style: write it like a short spoken line the person can read straight off the screen — natural and simple, but still polite, not rude or overly casual.
`;
        }

        if (genOral) {
            prompt += isJapanese ? `
[2. 口头/即时通讯场景 (viber/dingtalk/slack)]
- 敬语标准：常用礼貌敬语（如：ご連絡ありがとうございます、お願いいたします、いただければと思います、です/ます）。
- 风格：简洁自然，短小精悍，杜绝硬邦邦的复杂敬语与冗长废话。
` : `
[2. Casual / IM scenario (Slack/DingTalk/Viber)]
- Tone: polite but relaxed everyday business English (e.g. "Thanks for letting me know", "Could you please...", "Just wanted to check...").
- Style: short, natural, conversational — avoid stiff or overly formal wording.
`;
        }

        if (genBusiness) {
            prompt += isJapanese ? `
[3. 标准商务场景 (日常邮件/业务对接)]
- 敬语标准：得体专业（如：ご連絡いただきありがとうございます。問題ございません。いただければと存じます。）。
- 注意：**不需要**过度重度的敬语（如：申し上げます 等）。
` : `
[3. Standard business scenario (everyday email/business correspondence)]
- Tone: professional and courteous standard business English (e.g. "Thank you for reaching out", "That works on our end", "We would appreciate it if...").
- Note: avoid overly stiff or archaic phrasing — keep it natural professional English.
`;
        }

        if (genFormal) {
            prompt += isJapanese ? `
[4. 高度正式场景 (客户高层/正式致歉/正式函件)]
- 敬语标准：最高级别商务敬语（如：深くお詫び申し上げます、ご高配を賜りたく存じます）。
` : `
[4. Highly formal scenario (senior client contacts, formal apologies, official correspondence)]
- Tone: the most formal, respectful register of business English (e.g. "We sincerely apologize for...", "We would be most grateful for your continued support...").
`;
        }

        prompt += `
请严格按照以下纯文本格式输出结果（不要使用 JSON，不要使用 markdown 代码块标记，不要输出任何多余的说明文字）：
${genSpoken ? '###SPOKEN_START###\n(这里写简单口语文本)\n###SPOKEN_END###\n' : ''}${genOral ? '###ORAL_START###\n(这里写口头回复文本)\n###ORAL_END###\n' : ''}${genBusiness ? '###BUSINESS_START###\n(这里写标准商务文本)\n###BUSINESS_END###\n' : ''}${genFormal ? '###FORMAL_START###\n(这里写高度正式文本)\n###FORMAL_END###\n' : ''}
请务必带上对应的 ###xxx_START### 和 ###xxx_END### 标记，标记独占一行，标记之间才是正文内容。
`;

        // 各场景对应的标记与目标 DOM 元素
        const sections = [
            { key: 'SPOKEN', enabled: genSpoken, contentEl: 'resSpoken', cardEl: 'cardSpoken' },
            { key: 'ORAL', enabled: genOral, contentEl: 'resOral', cardEl: 'cardOral' },
            { key: 'BUSINESS', enabled: genBusiness, contentEl: 'resBusiness', cardEl: 'cardBusiness' },
            { key: 'FORMAL', enabled: genFormal, contentEl: 'resFormal', cardEl: 'cardFormal' }
        ];
        sections.forEach(s => {
            if (s.enabled) {
                const el = document.getElementById(s.contentEl);
                el.innerText = '';
                delete el.dataset.hasContent;
            }
        });

        // 根据当前已收到的全部文本，把每个 section 的内容实时刷新到对应卡片上，
        // 同时推进步骤指示器（依据 END 标记是否已经出现来判断某一步是否真正完成）
        function renderStreamedText(buffer) {
            sections.forEach(s => {
                if (!s.enabled) return;
                const startTag = `###${s.key}_START###`;
                const endTag = `###${s.key}_END###`;
                const startIdx = buffer.indexOf(startTag);
                if (startIdx === -1) return;

                const contentStart = startIdx + startTag.length;
                const endIdx = buffer.indexOf(endTag, contentStart);
                const text = endIdx === -1
                    ? buffer.slice(contentStart)
                    : buffer.slice(contentStart, endIdx);

                const card = document.getElementById(s.cardEl);
                if (card.style.display !== 'block') card.style.display = 'block';
                const contentEl = document.getElementById(s.contentEl);
                contentEl.innerText = text.trim();
                contentEl.dataset.hasContent = 'true';
            });

            // 依次检查当前步骤是否已经出现对应的 END 标记，出现则视为该步骤完成，推进到下一步
            while (contentStepPos < contentStepOrder.length) {
                const key = contentStepOrder[contentStepPos];
                if (buffer.includes(`###${key}_END###`)) {
                    setStepStatus(key, 'done');
                    contentStepPos++;
                    if (contentStepPos < contentStepOrder.length) {
                        setStepStatus(contentStepOrder[contentStepPos], 'active');
                    }
                } else {
                    break;
                }
            }
        }

        // 不同服务商的请求配置与流式响应解析方式
        const PROVIDER_CONFIG = {
            gemini: {
                url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${apiKey}`,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                }),
                extractPiece: (chunk) => chunk?.candidates?.[0]?.content?.parts?.[0]?.text,
                extractError: (errData) => errData?.error?.message || 'Gemini API request failed'
            },
            zhipu: {
                url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: 'user', content: prompt }],
                    stream: true
                }),
                extractPiece: (chunk) => chunk?.choices?.[0]?.delta?.content,
                extractError: (errData) => errData?.error?.message || '智谱 API request failed'
            }
        };

        const cfg = PROVIDER_CONFIG[provider];

        try {
            const response = await fetch(cfg.url, {
                method: 'POST',
                headers: cfg.headers,
                body: cfg.body
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => null);
                throw new Error(cfg.extractError(errData));
            }

            // 连接建立、开始收到流 -> 「连接」步骤完成，进入第一个内容生成步骤
            setStepStatus('connect', 'done');
            if (contentStepOrder.length > 0) {
                setStepStatus(contentStepOrder[0], 'active');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let sseBuffer = '';   // 未处理完的原始 SSE 数据
            let textBuffer = '';  // 已解析出的模型文本（用于按标记切分渲染）
            let gotAnyText = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                sseBuffer += decoder.decode(value, { stream: true });
                const lines = sseBuffer.split('\n');
                sseBuffer = lines.pop(); // 最后一行可能不完整，留到下一轮

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed.startsWith('data:')) continue;
                    const jsonStr = trimmed.slice(5).trim();
                    if (!jsonStr || jsonStr === '[DONE]') continue;
                    try {
                        const chunk = JSON.parse(jsonStr);
                        const piece = cfg.extractPiece(chunk);
                        if (piece) {
                            textBuffer += piece;
                            gotAnyText = true;
                            renderStreamedText(textBuffer);
                        }
                    } catch (e) {
                        // 单个 chunk 解析失败就跳过，不中断整个流
                    }
                }
            }

            if (!gotAnyText) {
                throw new Error('No response text returned by the selected provider.');
            }

            // 流结束后再刷新一次，确保末尾标记也被正确裁剪掉
            renderStreamedText(textBuffer);

            // 保险：如果最后一步因为标记未被完整捕获而没被标记为 done，这里统一收尾
            contentStepOrder.forEach(key => setStepStatus(key, 'done'));
            setStepStatus('done', 'done');

            // 生成成功后自动保存到浏览器本地历史，不上传服务器
            saveCurrentToHistory();

        } catch (err) {
            alert(t('genFailed') + err.message);
        } finally {
            submitBtn.disabled = false;
            loading.style.display = 'none';
            setTimeout(() => { stepIndicatorEl.style.display = 'none'; }, 900);
        }
    }

    // ---------- Local history ----------
    const HISTORY_KEY = 'piiislator_translation_history';
    const HISTORY_LIMIT = 100;
    let selectedHistoryId = null;

    function getHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
        catch (e) { return []; }
    }
    function saveCurrentToHistory() {
        const results = {};
        ['Spoken','Oral','Business','Formal'].forEach(name => {
            const el = document.getElementById('res' + name);
            if (el && el.dataset.hasContent && el.innerText.trim()) results[name.toUpperCase()] = el.innerText.trim();
        });
        if (!Object.keys(results).length) return;
        const item = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), timestamp: new Date().toISOString(),
            provider: document.getElementById('providerSelect')?.value || '',
            model: document.getElementById('modelSelect')?.value || '',
            modelLabel: document.getElementById('modelSelect')?.selectedOptions?.[0]?.textContent || document.getElementById('modelSelect')?.value || '',
            targetLang: document.getElementById('targetLang').value,
            recipientType: document.querySelector('input[name="recipientType"]:checked')?.value || '',
            mode: document.querySelector('input[name="commMode"]:checked')?.value || '',
            isEmail: document.getElementById('isEmail').checked,
            context: document.getElementById('contextInput').value.trim(), idea: document.getElementById('ideaInput').value.trim(), results
        };
        const history = getHistory(); history.unshift(item);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
        renderHistory();
    }
    function openHistory(){ renderHistory(); document.getElementById('historyOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
    function closeHistory(){ document.getElementById('historyOverlay').classList.remove('open'); document.body.style.overflow=''; closeHistoryDetail(); }
    function handleHistoryOverlayClick(e){ if(e.target.id==='historyOverlay') closeHistory(); }
    function formatHistoryDate(iso){
        const d=new Date(iso), now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()), date=new Date(d.getFullYear(),d.getMonth(),d.getDate()), diff=Math.round((today-date)/86400000);
        if(diff===0)return currentUILang==='zh'?'今天':'Today'; if(diff===1)return currentUILang==='zh'?'昨天':'Yesterday';
        return currentUILang==='zh'?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
    }
    function formatHistoryTime(iso){const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
    function historyMeta(item){
        const lang=item.targetLang==='日语'?(currentUILang==='zh'?'日语':'Japanese'):(currentUILang==='zh'?'英语':'English');
        const m={SPOKEN:currentUILang==='zh'?'简单口语':'Simple Spoken',ORAL:currentUILang==='zh'?'即时通讯':'Casual / IM',BUSINESS:currentUILang==='zh'?'商务':'Business',FORMAL:currentUILang==='zh'?'正式':'Formal'};
        const tones=Object.keys(item.results||{}).map(k=>m[k]).filter(Boolean).join(' · ');
        const model=item.modelLabel || item.model || '';
        return `${lang}${tones?' · '+tones:''}${item.isEmail?' · Email':''}${model?' · '+model:''}`;
    }
    function escapeHistory(str){return String(str??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function renderHistory(){
        const list=document.getElementById('historyList'); if(!list)return; const history=getHistory();
        if(!history.length){list.innerHTML=`<div class="history-empty">${currentUILang==='zh'?'还没有历史记录。<br>生成一次翻译后，会自动保存在这里。':'No history yet.<br>Your translations will be saved here automatically.'}</div>`;return;}
        let lastGroup=''; list.innerHTML=history.map(item=>{const group=formatHistoryDate(item.timestamp), gh=group!==lastGroup?`<div class="history-group-title">${escapeHistory(group)}</div>`:'';lastGroup=group;return `${gh}<button class="history-item" onclick="openHistoryDetail('${item.id}')"><div class="history-time">${formatHistoryTime(item.timestamp)}</div><div class="history-preview">${escapeHistory(item.idea||'')}</div><div class="history-meta">${escapeHistory(historyMeta(item))}</div><span class="history-delete" onclick="deleteHistory(event,'${item.id}')">×</span></button>`;}).join('');
    }
    function deleteHistory(e,id){e.stopPropagation();localStorage.setItem(HISTORY_KEY,JSON.stringify(getHistory().filter(x=>x.id!==id)));renderHistory();}
    function clearAllHistory(){if(!getHistory().length)return;if(!confirm(currentUILang==='zh'?'确定要清空全部历史记录吗？':'Clear all history?'))return;localStorage.removeItem(HISTORY_KEY);renderHistory();closeHistoryDetail();}
    function openHistoryDetail(id){
        selectedHistoryId=id; const item=getHistory().find(x=>x.id===id); if(!item)return; const L=currentUILang==='zh';
        document.getElementById('historyDetailTitle').textContent=formatHistoryDate(item.timestamp)+'  '+formatHistoryTime(item.timestamp);
        const blocks=[];
        if(item.modelLabel || item.model){
            blocks.push(`<div class="history-block history-model"><div class="history-block-label">${L?'使用模型':'Model used'}</div><div class="history-block-text">${escapeHistory(item.modelLabel || item.model)}${item.provider ? ` <span class="history-model-provider">· ${escapeHistory(item.provider)}</span>` : ''}</div></div>`);
        } if(item.idea)blocks.push(`<div class="history-block"><div class="history-block-label">${L?'你想表达的内容':'Your message'}</div><div class="history-block-text">${escapeHistory(item.idea)}</div></div>`);
        if(item.context)blocks.push(`<div class="history-block"><div class="history-block-label">${L?'上下文':'Context'}</div><div class="history-block-text">${escapeHistory(item.context)}</div></div>`);
        const labels={SPOKEN:L?'简单口语':'Simple Spoken',ORAL:L?'即时通讯':'Casual / IM',BUSINESS:L?'商务':'Business',FORMAL:L?'正式':'Formal'};
        Object.entries(item.results||{}).forEach(([key,text])=>blocks.push(`<div class="history-block history-result"><div class="history-result-label">${labels[key]||key}</div><div class="history-result-text">${escapeHistory(text)}</div></div>`));
        document.getElementById('historyDetailBody').innerHTML=blocks.join('');document.getElementById('historyDetail').classList.add('open');
    }
    function closeHistoryDetail(){const el=document.getElementById('historyDetail');if(el)el.classList.remove('open');}
    function restoreHistoryItem(){
        const item=getHistory().find(x=>x.id===selectedHistoryId);if(!item)return;
        const setVal=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v;}; setVal('targetLang',item.targetLang);setVal('contextInput',item.context||'');setVal('ideaInput',item.idea||'');
        const rec=document.querySelector(`input[name="recipientType"][value="${item.recipientType}"]`);if(rec)rec.checked=true;
        const mode=document.querySelector(`input[name="commMode"][value="${item.mode}"]`);if(mode){mode.checked=true;toggleCommMode();}
        const email=document.getElementById('isEmail');if(email)email.checked=!!item.isEmail; closeHistory(); window.scrollTo({top:0,behavior:'smooth'});
    }

    function copyText(elementId) {
        const el = document.getElementById(elementId);
        const text = el.innerText;
        if (text && el.dataset.hasContent) {
            navigator.clipboard.writeText(text).then(() => {
                alert(t('copied'));
            });
        }
    }
</script>
