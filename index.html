    <style>
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f8f9fb;
  --text:#111318;
  --muted:#747a84;
  --line:#e5e7eb;
  --accent:#17191d;
  --accent-hover:#30343a;
  --blue:#3157d5;
  --green:#18835b;
  --violet:#7254b8;
  --shadow:0 18px 50px rgba(16,24,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.95),transparent 38%),
    var(--bg);
  color:var(--text);
  padding:42px 24px 56px;
}
.container{max-width:1180px;width:100%;margin:0 auto}
header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 4px 28px;border-bottom:1px solid var(--line);margin-bottom:28px
}
.brand{display:flex;flex-direction:column;gap:7px}
.brand-row{display:flex;align-items:center;gap:11px}
.brand-logo{width:40px;height:40px;border-radius:10px;display:block;box-shadow:0 4px 14px rgba(16,24,40,.18)}
h1{font-size:2rem;line-height:1;font-weight:900;letter-spacing:-.045em;color:var(--text)}
.brand-sub{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.api-key-section{display:flex;align-items:center;gap:8px}
.header-controls{display:flex;align-items:center;gap:14px}
.ui-lang-switch{
  display:flex;align-items:center;gap:2px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:3px;
}
.lang-btn{
  border:0;background:transparent;cursor:pointer;
  padding:6px 12px;border-radius:6px;font-size:.78rem;font-weight:600;
  color:var(--muted);transition:.15s;
}
.lang-btn:hover{color:var(--text)}
.lang-btn.active{background:var(--accent);color:#fff}
.api-key-section select{
  height:36px;padding:0 30px 0 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);font-size:.78rem;color:var(--text);
  outline:none;cursor:pointer
}
.api-key-section input{
  width:220px;height:36px;padding:0 13px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);font-size:.82rem;outline:none
}
.api-key-section input:focus{border-color:#b9bdc5;box-shadow:0 0 0 3px rgba(23,25,29,.05)}
.main-grid{display:grid;grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr);gap:22px;align-items:stretch}
.panel{
  background:rgba(255,255,255,.92);border:1px solid rgba(229,231,235,.9);
  border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;
  box-shadow:var(--shadow)
}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--line)
}
.panel-title strong{font-size:.9rem;letter-spacing:.01em}
.panel-title span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.field{display:flex;flex-direction:column;gap:0}
.field>label{display:block;line-height:1.3;margin:0 0 7px}
label{font-weight:600;font-size:.78rem;color:#3c4149;letter-spacing:.01em;margin:0}
textarea,select{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);font-size:.9rem;color:var(--text);resize:vertical;outline:none;
  transition:.2s
}
textarea{line-height:1.55}
textarea:focus,select:focus{border-color:#aeb3bc;background:#fff;box-shadow:0 0 0 3px rgba(23,25,29,.045)}
.radio-group,.checkbox-group{display:grid;grid-template-columns:1fr;gap:7px}
.radio-label,.checkbox-label{
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-weight:400;
  font-size:.82rem;color:#4b515b;line-height:1.35;margin:0
}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);margin-top:2px}
.btn{
  background:var(--accent);color:#fff;border:0;padding:13px 18px;border-radius:10px;
  font-weight:650;font-size:.88rem;cursor:pointer;transition:.2s;width:100%;
  letter-spacing:.01em
}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn:disabled{background:#a4a8ae;cursor:not-allowed;transform:none}
.result-card{
  min-height:148px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:18px 19px;position:relative;display:none
}
.result-title{
  font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px
}
.tag-oral{color:var(--green)}.tag-business{color:var(--blue)}.tag-formal{color:var(--violet)}
.result-content{
  font-size:.92rem;line-height:1.72;white-space:pre-wrap;color:#30353d;word-break:break-word
}
.copy-btn{
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 9px;
  font-size:.7rem;cursor:pointer;color:#626873;white-space:nowrap
}
.copy-btn:hover{background:#f0f1f3;color:var(--text)}
.loading{text-align:center;padding:90px 0;color:var(--muted);font-size:.82rem;display:none}
#results{display:flex;flex-direction:column;gap:12px;flex:1}

.step-indicator{
  display:flex;flex-direction:column;gap:0;
  padding:6px 2px 18px;
}
.step-item{
  display:flex;align-items:center;gap:11px;
  padding:8px 2px;
  font-size:.82rem;color:var(--muted);
  position:relative;
}
.step-item .step-dot{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;background:#fff;
  transition:.2s;
}
.step-item:not(:last-child)::before{
  content:'';position:absolute;left:8px;top:26px;
  width:2px;height:calc(100% - 4px);
  background:var(--line);
}
.step-item.done .step-dot{background:var(--green);border-color:var(--green)}
.step-item.done .step-dot::after{content:'✓';color:#fff;font-size:.62rem;font-weight:700}
.step-item.done:not(:last-child)::before{background:var(--green)}
.step-item.active{color:var(--text);font-weight:650}
.step-item.active .step-dot{border-color:var(--accent)}
.step-item.active .step-dot::after{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:pulse-dot 1s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}

@media(max-width:850px){
  .settings-bar{grid-template-columns:1fr 1fr}
  .setting-item:nth-child(2){border-right:0}
  .setting-item:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .setting-item:nth-child(3){border-right:0}
}
@media(max-width:560px){
  .settings-bar{grid-template-columns:1fr}
  .setting-item{border-right:0!important;border-bottom:1px solid var(--line)}
  .setting-item:last-child{border-bottom:0}
}

@media(max-width:850px){
  body{padding:24px 15px 40px}
  header{align-items:flex-start;gap:18px;flex-direction:column}
  .header-controls{width:100%;flex-wrap:wrap;gap:10px}
  .api-key-section{width:100%;display:flex;flex-wrap:wrap}.api-key-section input{flex:1;min-width:180px}.api-key-section select{flex:0 1 auto}
  .main-grid{grid-template-columns:1fr}
}

.settings-bar{
  display:grid;
  grid-template-columns:1fr 1.18fr 1.18fr 1.18fr;
  gap:0;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(229,231,235,.95);
  border-radius:16px;
  box-shadow:0 12px 38px rgba(16,24,40,.055);
  margin-bottom:22px;
  overflow:hidden;
}
.setting-item{
  min-width:0;
  padding:18px 22px 19px;
  border-right:1px solid var(--line);
}
.setting-item:last-child{border-right:0}
.setting-item>label{
  display:block;
  margin-bottom:10px;
  font-size:.67rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:#8a9099;
}
.setting-item select{
  height:34px;
  padding:0 28px 0 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-2);
  color:var(--text);
  font-size:.79rem;
  outline:none;
}
.setting-options .radio-group,
.setting-options .checkbox-group{
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  align-items:center;
  gap:7px 14px;
}
.setting-options .radio-label,
.setting-options .checkbox-label{
  font-size:.76rem;
  white-space:nowrap;
}
.email-option{margin-left:2px!important}
.settings-bar .checkbox-group .checkbox-label{margin-bottom:0}

#contextInput{min-height:100px}
#ideaInput{min-height:125px}

.communication-options .email-option{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0!important;
  line-height:1;
}
.communication-options .email-option input{
  margin:0;
  transform:translateY(0);
}
.communication-options .email-option span{
  display:inline-block;
  line-height:1.2;
}

.communication-options .radio-group{
  display:grid!important;
  grid-template-columns:1fr 1fr;
  column-gap:16px;
  row-gap:7px;
}
.communication-options .email-option{
  grid-column:2;
  grid-row:1;
  align-self:center;
  justify-self:start;
  margin:0!important;
  margin-left:8px!important;
  white-space:normal;
}
.communication-options .email-option span{
  white-space:normal;
}

.recipient-options .radio-group{
  display:grid!important;
  grid-template-columns:1fr;
  gap:7px;
}

.output-setting .checkbox-group{
  display:grid!important;
  grid-template-columns:1fr 1fr;
  column-gap:14px;
  row-gap:7px;
}
.output-setting .checkbox-label:last-child{
  grid-column:1;
}

@media(max-width:850px){
  .settings-bar{grid-template-columns:1fr 1fr}
  .communication-options .radio-group,
  .output-setting .checkbox-group{grid-template-columns:1fr}
  .communication-options .email-option{grid-column:1;grid-row:auto;margin-left:0!important}
  .output-setting .checkbox-label:last-child{grid-column:auto}
}
@media(max-width:560px){
  .settings-bar{grid-template-columns:1fr}
}
</style>

        </div>
        <div class="setting-item">
            <label data-i18n="communication">Communication</label>

                <div class="radio-group">

                        <input type="radio" name="commMode" value="initiate" onchange="toggleCommMode()"> <span data-i18n="initiate">Initiate</span>

                    </label>
                    <label class="radio-label">

            <div id="contextGroup" class="field">
                <label for="contextInput"><span data-i18n="context">Context</span> <span style="font-weight:400;color:var(--muted)" data-i18n="optional">(optional)</span></label>

            <div class="field">

    let currentUILang = 'zh';

    function t(key) {
        return (I18N[currentUILang] && I18N[currentUILang][key]) || I18N.en[key] || key;
    }

    function setUILang(lang) {
        if (!I18N[lang]) lang = 'zh';
        currentUILang = lang;
        localStorage.setItem('translator_ui_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            // 结果卡片里已经有真实生成内容时，不要用「等待生成」占位符把它覆盖掉
            if (key === 'waiting' && el.classList.contains('result-content')) {
                const isPlaceholder = !el.dataset.hasContent;
                if (isPlaceholder) el.textContent = t('waiting');
                return;
            }
            el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
        });

        document.getElementById('langBtnZh').classList.toggle('active', lang === 'zh');
        document.getElementById('langBtnEn').classList.toggle('active', lang === 'en');
    }

    const MODEL_OPTIONS = {
        gemini: [
            { value: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash' },
            { value: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash' }
        ]
    };

    function updateModelOptions() {
        const select = document.getElementById('modelSelect');
        const savedModel = localStorage.getItem('translator_model_gemini');
        select.innerHTML = '';

        MODEL_OPTIONS.gemini.forEach(model => {
            const option = document.createElement('option');
            option.value = model.value;
            option.textContent = model.label;
            select.appendChild(option);
        });

        const valid = MODEL_OPTIONS.gemini.some(m => m.value === savedModel);
        select.value = valid ? savedModel : 'gemini-3.6-flash';

        select.onchange = function() {
            localStorage.setItem('translator_model_gemini', select.value);
        };
    }

    function loadProviderKey() {
        const savedKey = localStorage.getItem('gemini_api_key') || '';
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('apiKey').placeholder = 'Gemini API Key';
    }

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('gemini_api_key', key);
            alert(t('apiKeySaved'));
        } else {
            localStorage.removeItem('gemini_api_key');
            alert(t('apiKeyCleared'));
        }
    }

    function toggleCommMode() {
        const mode = document.querySelector('input[name="commMode"]:checked').value;
        const contextGroup = document.getElementById('contextGroup');
        if (mode === 'initiate') {
            contextGroup.style.display = 'none';
        } else {
            contextGroup.style.display = 'block';
        }
    }

    async function generateResponse() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelSelect').value;
        const targetLang = document.getElementById('targetLang').value;
        const recipientType = document.querySelector('input[name="recipientType"]:checked').value;
        const mode = document.querySelector('input[name="commMode"]:checked').value;
        const isEmail = document.getElementById('isEmail').checked;
        const context = document.getElementById('contextInput').value.trim();
        const idea = document.getElementById('ideaInput').value.trim();

        const genOral = document.getElementById('genOral').checked;
        const genBusiness = document.getElementById('genBusiness').checked;
        const genFormal = document.getElementById('genFormal').checked;

        if (!apiKey) {
            alert(t('apiKeyRequired'));
            return;
        }

        if (!idea) {
            alert(t('ideaRequired'));
            return;
        }

        if (!genOral && !genBusiness && !genFormal) {
            alert(t('toneRequired'));
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const stepIndicatorEl = document.getElementById('stepIndicator');

        document.getElementById('cardOral').style.display = 'none';
        document.getElementById('cardBusiness').style.display = 'none';
        document.getElementById('cardFormal').style.display = 'none';

        submitBtn.disabled = true;
        loading.style.display = 'none';

        // 构建真实的步骤列表：连接 -> 依次生成各语气 -> 完成
        const stepDefs = [{ id: 'connect', label: t('stepConnect') }];
        const contentStepOrder = [];
        if (genOral) { stepDefs.push({ id: 'ORAL', label: t('stepOral') }); contentStepOrder.push('ORAL'); }
        if (genBusiness) { stepDefs.push({ id: 'BUSINESS', label: t('stepBusiness') }); contentStepOrder.push('BUSINESS'); }
        if (genFormal) { stepDefs.push({ id: 'FORMAL', label: t('stepFormal') }); contentStepOrder.push('FORMAL'); }
        stepDefs.push({ id: 'done', label: t('stepDone') });

        stepIndicatorEl.innerHTML = stepDefs.map(s =>
            `<div class="step-item" data-step="${s.id}"><span class="step-dot"></span><span>${s.label}</span></div>`
        ).join('');
        stepIndicatorEl.style.display = 'flex';

        function setStepStatus(id, status) {
            const el = stepIndicatorEl.querySelector(`.step-item[data-step="${id}"]`);
            if (!el) return;
            el.classList.remove('done', 'active');
            if (status) el.classList.add(status);
        }

        setStepStatus('connect', 'active');
        let contentStepPos = 0;

        const isJapanese = targetLang === '日语';

        const greetingInstruction = isJapanese
            ? (recipientType === 'internal'
                ? '开头统一使用“お疲れ様です。”作为问候语。'
                : '开头统一使用“お世話になっております。”作为问候语。')
            : (recipientType === 'internal'
                ? '开头使用简短自然的英文问候语（如：Hi [Name], / Hope you are doing well,），不要用日语。'
                : '开头使用得体的英文商务问候语（如：Dear [Name], / Hello [Name],），不要用日语。');

        let prompt = `你是一位精通中日/中英商务沟通的专家。请将用户的要点翻译转换为【${targetLang}】。**无论如何，最终输出必须完全是${targetLang}，不允许混入其他语言的词汇或句子。**

【沟通基本设定】：
- 沟通对象：${recipientType === 'internal' ? '同事/跨部门同事' : '外部公司/店铺担当'}
- 开头寒暄要求：${greetingInstruction}
- 沟通模式：${mode === 'reply' ? 'Reply消息' : '主动找对方发起沟通'}
- 是否为邮件：${isEmail ? `是（如果生成商务或正式邮件，最上方需附带【${isJapanese ? '件名：xxx' : 'Subject: xxx'}】）` : '否（即时消息/普通文本）'}
${mode === 'reply' && context ? `- 【对方发来的原话/上下文】：${context}` : ''}
- 【用户想表达的核心意思】：${idea}

${isJapanese ? `【"〜の件" 使用规则（非常严格，请务必遵守）】：
1. **只有在【Reply】且上下文明确有某个具体事项时**，才可以自然使用"〜の件"引出话题。
2. **绝对禁止无上下文乱用"〜の件"**！如果用户是【Initiate发起沟通】，或者没有明确具体的对应事项，直接表达核心意思即可，切勿硬加"〜の件"。

` : ''}【场景语气分寸要求】：

`;

        if (genOral) {
            prompt += isJapanese ? `
[1. 口头/即时通讯场景 (viber/dingtalk/slack)]
- 敬语标准：常用礼貌敬语（如：ご連絡ありがとうございます、お願いいたします、いただければと思います、です/ます）。
- 风格：简洁自然，短小精悍，杜绝硬邦邦的复杂敬语与冗长废话。
` : `
[1. Casual / IM scenario (Slack/DingTalk/Viber)]
- Tone: polite but relaxed everyday business English (e.g. "Thanks for letting me know", "Could you please...", "Just wanted to check...").
- Style: short, natural, conversational — avoid stiff or overly formal wording.
`;
        }

        if (genBusiness) {
            prompt += isJapanese ? `
[2. 标准商务场景 (日常邮件/业务对接)]
- 敬语标准：得体专业（如：ご連絡いただきありがとうございます。問題ございません。いただければと存じます。）。
- 注意：**不需要**过度重度的敬语（如：申し上げます 等）。
` : `
[2. Standard business scenario (everyday email/business correspondence)]
- Tone: professional and courteous standard business English (e.g. "Thank you for reaching out", "That works on our end", "We would appreciate it if...").
- Note: avoid overly stiff or archaic phrasing — keep it natural professional English.
`;
        }

        if (genFormal) {
            prompt += isJapanese ? `
[3. 高度正式场景 (客户高层/正式致歉/正式函件)]
- 敬语标准：最高级别商务敬语（如：深くお詫び申し上げます、ご高配を賜りたく存じます）。
` : `
[3. Highly formal scenario (senior client contacts, formal apologies, official correspondence)]
- Tone: the most formal, respectful register of business English (e.g. "We sincerely apologize for...", "We would be most grateful for your continued support...").
`;
        }

        prompt += `
请严格按照以下纯文本格式输出结果（不要使用 JSON，不要使用 markdown 代码块标记，不要输出任何多余的说明文字）：
${genOral ? '###ORAL_START###\n(这里写口头回复文本)\n###ORAL_END###\n' : ''}${genBusiness ? '###BUSINESS_START###\n(这里写标准商务文本)\n###BUSINESS_END###\n' : ''}${genFormal ? '###FORMAL_START###\n(这里写高度正式文本)\n###FORMAL_END###\n' : ''}
请务必带上对应的 ###xxx_START### 和 ###xxx_END### 标记，标记独占一行，标记之间才是正文内容。
`;

        // 各场景对应的标记与目标 DOM 元素
        const sections = [
            { key: 'ORAL', enabled: genOral, contentEl: 'resOral', cardEl: 'cardOral' },
            { key: 'BUSINESS', enabled: genBusiness, contentEl: 'resBusiness', cardEl: 'cardBusiness' },
            { key: 'FORMAL', enabled: genFormal, contentEl: 'resFormal', cardEl: 'cardFormal' }
        ];
        sections.forEach(s => {
            if (s.enabled) {
                const el = document.getElementById(s.contentEl);
                el.innerText = '';
                delete el.dataset.hasContent;
            }
        });

        // 根据当前已收到的全部文本，把每个 section 的内容实时刷新到对应卡片上，
        // 同时推进步骤指示器（依据 END 标记是否已经出现来判断某一步是否真正完成）
        function renderStreamedText(buffer) {
            sections.forEach(s => {
                if (!s.enabled) return;
                const startTag = `###${s.key}_START###`;
                const endTag = `###${s.key}_END###`;
                const startIdx = buffer.indexOf(startTag);
                if (startIdx === -1) return;

                const contentStart = startIdx + startTag.length;
                const endIdx = buffer.indexOf(endTag, contentStart);
                const text = endIdx === -1
                    ? buffer.slice(contentStart)
                    : buffer.slice(contentStart, endIdx);

                const card = document.getElementById(s.cardEl);
                if (card.style.display !== 'block') card.style.display = 'block';
                const contentEl = document.getElementById(s.contentEl);
                contentEl.innerText = text.trim();
                contentEl.dataset.hasContent = 'true';
            });

            // 依次检查当前步骤是否已经出现对应的 END 标记，出现则视为该步骤完成，推进到下一步
            while (contentStepPos < contentStepOrder.length) {
                const key = contentStepOrder[contentStepPos];
                if (buffer.includes(`###${key}_END###`)) {
                    setStepStatus(key, 'done');
                    contentStepPos++;
                    if (contentStepPos < contentStepOrder.length) {
                        setStepStatus(contentStepOrder[contentStepPos], 'active');
                    }
                } else {
                    break;
                }
            }
        }

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => null);
                throw new Error(errData?.error?.message || 'Gemini API request failed');
            }

            // 连接建立、开始收到流 -> 「连接」步骤完成，进入第一个内容生成步骤
            setStepStatus('connect', 'done');
            if (contentStepOrder.length > 0) {
                setStepStatus(contentStepOrder[0], 'active');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let sseBuffer = '';   // 未处理完的原始 SSE 数据
            let textBuffer = '';  // 已解析出的模型文本（用于按标记切分渲染）
            let gotAnyText = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                sseBuffer += decoder.decode(value, { stream: true });
                const lines = sseBuffer.split('\n');
                sseBuffer = lines.pop(); // 最后一行可能不完整，留到下一轮

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed.startsWith('data:')) continue;
                    const jsonStr = trimmed.slice(5).trim();
                    if (!jsonStr || jsonStr === '[DONE]') continue;
                    try {
                        const chunk = JSON.parse(jsonStr);
                        const piece = chunk?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (piece) {
                            textBuffer += piece;
                            gotAnyText = true;
                            renderStreamedText(textBuffer);
                        }
                    } catch (e) {
                        // 单个 chunk 解析失败就跳过，不中断整个流
                    }
                }
            }

            if (!gotAnyText) {
                throw new Error('No response text returned by the selected provider.');
            }

            // 流结束后再刷新一次，确保末尾标记也被正确裁剪掉
            renderStreamedText(textBuffer);

            // 保险：如果最后一步因为标记未被完整捕获而没被标记为 done，这里统一收尾
            contentStepOrder.forEach(key => setStepStatus(key, 'done'));
            setStepStatus('done', 'done');

        } catch (err) {
            alert(t('genFailed') + err.message);
        } finally {
            submitBtn.disabled = false;
            loading.style.display = 'none';
            setTimeout(() => { stepIndicatorEl.style.display = 'none'; }, 900);
        }
    }

    function copyText(elementId) {
        const el = document.getElementById(elementId);
        const text = el.innerText;
        if (text && el.dataset.hasContent) {
            navigator.clipboard.writeText(text).then(() => {
                alert(t('copied'));
            });
        }
    }
</script>
